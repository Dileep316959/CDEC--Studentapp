services:
  db:
    image: mysql:8.0
    container_name: student_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: student_backend
    ports:
      - "5005:5005"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: student_db
      FLASK_PORT: 5005
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: student_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5005
    depends_on:
      - backend

volumes:
  mysql_data: